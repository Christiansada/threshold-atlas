name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and minimal synthetic CSV
      description: Never include private records, identifiers, or credentials.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and version
